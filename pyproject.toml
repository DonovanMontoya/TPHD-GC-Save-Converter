[project]
name = "tphd-gc-save-converter"
version = "0.1.0"
description = "Twilight Princess HD and GameCube/Dolphin save converter"
requires-python = ">=3.10"

[tool.pyright]
pythonVersion = "3.10"
include = ["*.py", "tools", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["tp"]
